# Zonas de la demostración sintética SEEA-AI (cajas: [oeste, sur, este, norte], EPSG:4326)
# AVISO: son cajas rectangulares aproximadas para la demostración offline; no coinciden con las
# cuencas hidrográficas usadas en la tesis (véanse los scripts de gee/ en la raíz del repositorio).
sites:
  - name: Murrumbidgee        # Australia — región de referencia de la cuenca Murray–Darling (CSIRO)
    bbox: [144.0, -35.5, 146.5, -34.0]
    role: reference            # referencia estructural frente a las cuentas experimentales del CSIRO
    country: Australia
  - name: Rio_Sinu            # Colombia — caso de uso principal de la tesis
    bbox: [-76.5, 8.0, -75.0, 9.5]
    role: transfer
    country: Colombia
  - name: Alto_Madre_de_Dios  # Perú — segunda aplicación tropical (afluente amazónico)
    bbox: [-72.2, -14.0, -69.8, -11.6]  # caja aproximada solo para la demostración; el límite usado
                                         # en la tesis es la coincidencia de prefijo Pfafstetter en
                                         # HydroBASINS hybas_8 (~35.183 km2), en gee/validation_madre_de_dios.js
    role: transfer
    country: Peru

# Épocas de análisis
epochs: [2020, 2024]

# Parámetros económicos (escenario base)
economics:
  carbon_price_usd_per_tco2: 25.0      # orden de magnitud de referencia (World Bank, 2024)
  sediment_unit_value_usd_per_t: 18.0  # coste evitado de tratamiento de agua
  discount_rate: 0.03                  # base; la sensibilidad usa 0,015 / 0,06
  biomass_to_carbon_fraction: 0.47     # valor por defecto del IPCC
